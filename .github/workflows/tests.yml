name: tests

on:
  push:
  pull_request:

# Solo lectura del repo: el workflow no publica nada.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sin secretos ni credenciales de Alpaca: toda la red está simulada en los
    # tests (requests.get parcheado) y la config se importa sin .env.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q
